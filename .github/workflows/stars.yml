name: Live profile proof

on:
  schedule:
    - cron: '41 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stars
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test profile updaters
        run: python3 -m unittest tools/test_stars.py tools/test_releases.py

      - name: Refresh star counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/stars.py README.md

      - name: Refresh recent releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/releases.py README.md

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --cached --quiet && { echo "star counts are current"; exit 0; }
          git commit -m "profile: refresh live proof [skip ci]"
          git push origin HEAD:main
